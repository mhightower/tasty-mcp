[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasty-mcp"
version = "0.1.0"
description = "MCP server for Tastytrade-style options education and strategy lookup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.3.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=tasty_mcp --cov-report=term-missing --cov-fail-under=85"
